html, body {
  font-family: "Baloo Bhaijaan 2", "Cairo", system-ui, sans-serif;
  background: #07271c;
  overflow-x: hidden;
}
.font-kids {
  font-family: "Baloo Bhaijaan 2", "Cairo", system-ui, sans-serif;
}
@keyframes floaty {
  0%, 100% {
    transform: translateY(0) rotate(0deg);
  }
  50% {
    transform: translateY(-14px) rotate(2deg);
  }
}
@keyframes floaty2 {
  0%, 100% {
    transform: translateY(0) rotate(0deg);
  }
  50% {
    transform: translateY(12px) rotate(-3deg);
  }
}
@keyframes firefly {
  0%, 100% {
    transform: translate(0,0) scale(1);
    opacity: .2;
  }
  25% {
    opacity: 1;
  }
  50% {
    transform: translate(18px,-26px) scale(1.25);
    opacity: .9;
  }
  75% {
    opacity: 1;
  }
}
@keyframes sway {
  0%, 100% {
    transform: rotate(-4deg);
  }
  50% {
    transform: rotate(4deg);
  }
}
@keyframes wiggle {
  0%, 100% {
    transform: rotate(-3deg);
  }
  50% {
    transform: rotate(3deg);
  }
}
@keyframes glowPulse {
  0%, 100% {
    box-shadow: 0 0 20px 4px rgba(255,207,77,.55), 0 0 60px 10px rgba(255,157,46,.25);
  }
  50% {
    box-shadow: 0 0 36px 10px rgba(255,207,77,.85), 0 0 90px 20px rgba(255,157,46,.4);
  }
}
@keyframes gateGlow {
  0%, 100% {
    filter: drop-shadow(0 0 18px rgba(255,207,77,.8));
  }
  50% {
    filter: drop-shadow(0 0 42px rgba(255,207,77,1));
  }
}
@keyframes shimmer {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}
@keyframes popIn {
  0% {
    transform: scale(.4);
    opacity: 0;
  }
  60% {
    transform: scale(1.12);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
@keyframes shakeX {
  0%, 100% {
    transform: translateX(0);
  }
  20%, 60% {
    transform: translateX(-8px);
  }
  40%, 80% {
    transform: translateX(8px);
  }
}
@keyframes leafFall {
  0% {
    transform: translateY(-10vh) rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(340deg);
    opacity: 0;
  }
}
@keyframes twinkle {
  0%, 100% {
    opacity: .25;
    transform: scale(.8);
  }
  50% {
    opacity: 1;
    transform: scale(1.15);
  }
}
.animate-floaty {
  animation: floaty 4.5s ease-in-out infinite;
}
.animate-floaty2 {
  animation: floaty2 5.5s ease-in-out infinite;
}
.animate-sway {
  animation: sway 5s ease-in-out infinite;
  transform-origin: bottom center;
}
.animate-wiggle {
  animation: wiggle 1.6s ease-in-out infinite;
}
.animate-glow {
  animation: glowPulse 2.2s ease-in-out infinite;
}
.animate-pop {
  animation: popIn .45s cubic-bezier(.34,1.56,.64,1) both;
}
.animate-shake {
  animation: shakeX .45s ease both;
}
.animate-twinkle {
  animation: twinkle 2.4s ease-in-out infinite;
}
.firefly {
  position: absolute;
  border-radius: 9999px;
  background: radial-gradient(circle, #fff8c2 0%, #ffdf5d 35%, rgba(255,180,40,0) 70%);
  pointer-events: none;
  animation: firefly 6s ease-in-out infinite;
}
.shimmer-text {
  background: linear-gradient(110deg, #ffcf4d 20%, #fff7d6 40%, #ffcf4d 60%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shimmer 3s linear infinite;
}
.card-3d {
  box-shadow: 0 10px 0 rgba(0,0,0,.18), 0 20px 40px rgba(0,0,0,.35);
}
.card-3d:active {
  transform: translateY(4px);
  box-shadow: 0 4px 0 rgba(0,0,0,.18);
}
.text-stroke {
  -webkit-text-stroke: 2px rgba(7,39,28,.9);
  paint-order: stroke fill;
}
button {
  -webkit-tap-highlight-color: transparent;
}
::-webkit-scrollbar {
  width: 10px;
}
::-webkit-scrollbar-track {
  background: #07271c;
}
::-webkit-scrollbar-thumb {
  background: #166344;
  border-radius: 8px;
}
